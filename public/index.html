<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성장한걸음 | AI 맞춤형 피드백</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#26362e;font:15px/1.65 system-ui,sans-serif}header{background:#23483b;color:white;padding:28px max(5vw,20px)}header h1{margin:0;font-size:30px;letter-spacing:-2px}header p{margin:4px 0;color:#d9e8db}main{max-width:1240px;margin:auto;padding:28px 20px;display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:white;border:1px solid #e0e4dc;border-radius:14px;padding:24px;min-width:0}h2{margin:0 0 16px;font-size:22px}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #c8d0c7;border-radius:7px;padding:10px;background:white;color:inherit}textarea{resize:vertical;min-height:80px}button{cursor:pointer;border:1px solid #c8d0c7;border-radius:7px;background:white;color:#23483b;padding:9px 14px;font-weight:650}button:disabled{opacity:.5;cursor:wait}.primary{background:#23483b;color:white;border-color:#23483b;width:100%;margin-top:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.note{font-size:13px;color:#52645a}.notice{background:#edf1e8;padding:12px;border-radius:8px}.result{border-left:4px solid #72957c;background:#f7f9f5;padding:12px;margin:12px 0;border-radius:6px}.result:nth-child(2){border-color:#b28b4d}.result:nth-child(3){border-color:#6486a0}.result h3{margin:0;font-size:16px}.result textarea{background:white;min-height:105px;margin-top:8px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar button{font-size:12px;padding:4px 9px}#status{min-height:24px;color:#365d48}#status.error{color:#a52d24}footer{text-align:center;padding:0 20px 25px;color:#52645a;font-size:13px} [hidden]{display:none!important}:focus-visible{outline:3px solid #719c80;outline-offset:2px}@media(max-width:760px){main{grid-template-columns:1fr;padding:16px 12px}section{padding:18px}}
</style><script src="/app.js" defer></script></head><body><header><h1>성장한걸음</h1><p>학생의 배움을 이어 주는 AI 맞춤형 피드백</p></header><main><section><h2>01. 학습 정보</h2><p class="notice note">과제 시연용입니다. 가상의 답안만 입력하세요. 입력 내용은 Google Gemini API로 전송됩니다.</p><form id="form"><div class="pair"><div><label for="grade">학년</label><select id="grade"><option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>5학년</option><option selected>6학년</option></select></div><div><label for="subject">교과</label><select id="subject"><option>국어</option><option>수학</option><option>사회</option><option>과학</option><option>도덕</option><option>영어</option><option>기타</option></select></div></div><label for="goal">학습 목표 *</label><textarea id="goal" required maxlength="1000"></textarea><label for="criteria">평가 기준 (선택)</label><textarea id="criteria" maxlength="1500"></textarea><label for="answer">학생 학습 결과물 *</label><textarea id="answer" required maxlength="6000" rows="7" placeholder="이름 등 개인정보를 제외한 가상의 답안을 입력하세요."></textarea><div class="pair"><div><label for="level">피드백 수준</label><select id="level"><option>쉬운 표현</option><option selected>기본</option><option>심화</option></select></div><div><label for="length">분량</label><select id="length"><option>간결하게</option><option selected>보통</option><option>자세하게</option></select></div></div><div class="actions"><select id="example" aria-label="예시 교과"><option>국어</option><option>수학</option><option>사회</option><option>과학</option></select><button type="button" id="load">예시 불러오기</button><button type="button" id="reset">초기화</button></div><button class="primary" id="generate">맞춤형 피드백 생성하기</button></form></section><section><h2>02. 피드백 결과</h2><p class="note">AI 결과는 교사용 초안입니다. 검토하고 직접 수정한 후 활용하세요.</p><p id="status" role="status" aria-live="polite">학습 정보를 입력하면 결과가 여기에 표시됩니다.</p><div id="results" hidden></div><div id="tools" class="actions" hidden><button id="copyAll">전체 복사</button><button id="save">TXT 저장</button><button id="again">다시 생성</button></div></section></main><footer>성장한걸음 · 교사 검토를 통한 과정 중심 피드백</footer></body></html>
